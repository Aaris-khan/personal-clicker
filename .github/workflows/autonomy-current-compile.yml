name: Current Main Compile Verification

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/autonomy-current-compile.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Compile current app
        run: gradle --no-daemon :app:assembleDebug
