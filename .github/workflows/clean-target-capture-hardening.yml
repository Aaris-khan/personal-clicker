name: Clean target screenshot hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-target-capture-hardening.yml'

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply clean capture patch
        run: python3 .github/scripts/apply_clean_target_capture_patch.py

      - name: Static diff checks
        run: |
          git diff --check
          git diff --stat
          grep -n 'AARISH_AI_CAPTURE_TRANSACTION_V2' app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          grep -n 'AARISH_AI_TARGET_WINDOW_CROP_V1' app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          grep -n 'AARISH_AI_CLEAN_CAPTURE_V1_OVERLAY' app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit verified source only
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "main changed during verification; refusing to overwrite newer work"
            exit 1
          fi
          rm -f .github/scripts/apply_clean_target_capture_patch.py
          rm -f .github/workflows/clean-target-capture-hardening.yml
          git config user.name "Aarish Automation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt \
                  app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt \
                  .github/scripts/apply_clean_target_capture_patch.py \
                  .github/workflows/clean-target-capture-hardening.yml
          git commit -m "Lock AI screenshots to the live target state [skip ci]"
          git push origin HEAD:main
