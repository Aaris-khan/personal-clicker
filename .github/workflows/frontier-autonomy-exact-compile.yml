name: Frontier Autonomy Exact Compile

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/frontier-autonomy-exact-compile.yml'
      - 'app/**'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compile current app
        id: compile
        continue-on-error: true
        run: gradle --no-daemon :app:assembleDebug

      - name: Record exact result
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p .ci-status
          FILE=".ci-status/frontier-autonomy-${SOURCE_SHA}.txt"
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "compile_outcome=${COMPILE_OUTCOME}"
            echo "workflow=Frontier Autonomy Exact Compile"
          } > "${FILE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILE}"
          if ! git diff --cached --quiet; then
            git commit -m "Record frontier autonomy compile result [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enforce compile
        if: always() && steps.compile.outcome != 'success'
        run: exit 1
