name: Precision Tap Engine Upgrade

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/precision-engine-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply surgical source patch
        run: |
          python3 .github/precision_patch.py
          git diff --check
          git diff -- app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt

      - name: Commit upgraded engine
        run: |
          if git diff --quiet -- app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt; then
            echo "No code changes required."
            exit 0
          fi
          git config user.name "Aaris Precision Upgrader"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt
          git commit -m "Harden semantic tap recording and replay [skip ci]"
          git push origin HEAD:main
