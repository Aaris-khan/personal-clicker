name: Precision Tap Engine Upgrade

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/precision-engine-upgrade.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Verify precision patch is idempotent
        run: |
          python3 .github/precision_patch.py
          git diff --check

      - name: Compile Kotlin without building APK
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit only if patch runner found missing source changes
        run: |
          if git diff --quiet -- app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt; then
            echo "Source already fully upgraded."
            exit 0
          fi
          git config user.name "Aaris Precision Upgrader"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt
          git commit -m "Complete semantic tap recording and replay hardening [skip ci]"
          git push origin HEAD:main
