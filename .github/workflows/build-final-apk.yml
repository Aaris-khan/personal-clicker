name: Build Final APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-final-apk.yml'
      - 'app/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build installable APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare final filename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AarishAI-final.apk
          sha256sum AarishAI-final.apk > AarishAI-final.apk.sha256
          ls -lh AarishAI-final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AarishAI-final-apk
          path: |
            AarishAI-final.apk
            AarishAI-final.apk.sha256
          if-no-files-found: error
          retention-days: 30
