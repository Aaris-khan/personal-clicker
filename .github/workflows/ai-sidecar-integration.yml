name: AI Sidecar Integration

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ai-sidecar-integration.yml'

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Verify existing AI engine
        run: |
          python3 .github/ai_sidecar_integration_patch.py
          python3 .github/ai_sidecar_hardening_runner.py
          python3 .github/ai_sidecar_runtime_guards.py

      - name: Add grounded mission intelligence
        run: |
          python3 .github/ai_sidecar_intelligence_patch.py
          git diff --check

      - name: Compile Kotlin without APK
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit verified source
        run: |
          if git diff --quiet -- app/src/main; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "Aaris AI Upgrader"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main
          git commit -m "Ground AI mission planning to live UI [skip ci]"
          git push origin HEAD:main
