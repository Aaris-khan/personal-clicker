name: Apply Local Vision Upgrade

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-local-vision-upgrade.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify wiring markers
        run: |
          grep -q 'AARISH_LOCAL_VISION_FALLBACK_V1_FIELDS' app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          grep -q 'AARISH_LOCAL_VISION_AI_WAIT_V1' app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          grep -q 'AARISH_LOCAL_VISION_SHORT_SETTLE_V1' app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          test -f app/src/main/java/com/aarishkhan/aarishai/LocalVisionLocator.kt

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compile debug Kotlin
        run: gradle :app:compileDebugKotlin --stacktrace --no-daemon
