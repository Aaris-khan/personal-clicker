name: Branch Vision Relay CI

on:
  push:
    branches:
      - feature/persistent-vision-relay

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      - name: Unit tests and debug compile
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
