name: Final Automation Verification Temporary

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ai-dynamic-target-temp.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build latest combined debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Remove temporary verifier
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ai-dynamic-target-temp.yml
          git commit -m "Finalize automation hardening verification [skip ci]"
          git push origin main
