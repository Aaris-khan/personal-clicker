name: AI Dynamic Target Hardening Temporary

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ai-dynamic-target-temp.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Apply dynamic target hardening
        run: python3 tools/ai_dynamic_target_harden_temp.py

      - name: Repair generated Kotlin regex escaping
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt')
          s = p.read_text()
          s = s.replace('Regex("\\s+")', 'Regex("\\\\s+")')
          s = s.replace('Regex("[^\\p{L}\\p{N}]+")', 'Regex("[^\\\\p{L}\\\\p{N}]+")')
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit verified dynamic target hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          git rm .github/workflows/ai-dynamic-target-temp.yml tools/ai_dynamic_target_harden_temp.py
          git commit -m "Make AI target matching dynamic and visual [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
