name: Verify Accessibility Interrupt Fail Closed

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/verify-interrupt-fail-closed.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Apply lifecycle hardening
        run: python3 tools/fail_closed_on_interrupt_v1.py

      - name: Verify diff and run tests
        run: |
          git diff --check
          grep -q "AARISH_AI_INTERRUPT_FAIL_CLOSED_V1" app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          grep -q 'aiSidecarController.stop("accessibility interrupted")' app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          gradle --no-daemon :app:testDebugUnitTest :app:compileDebugKotlin :app:assembleDebug

      - name: Prepare final verified APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AarishAI-autonomous-final.apk
          sha256sum AarishAI-autonomous-final.apk > AarishAI-autonomous-final.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AarishAI-autonomous-final-apk
          path: |
            AarishAI-autonomous-final.apk
            AarishAI-autonomous-final.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified lifecycle hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          git rm .github/workflows/verify-interrupt-fail-closed.yml
          git rm tools/fail_closed_on_interrupt_v1.py
          git commit -m "Fail closed on accessibility interruption (verified run $GITHUB_RUN_ID)"
          git push origin HEAD:main
