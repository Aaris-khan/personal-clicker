name: Teach Your AI v2 verify

on:
  push:
    branches:
      - upgrade/teach-your-ai-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Capture baseline lint debt
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug :app:lintRelease --continue
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import collections, json, re
          counts=collections.Counter()
          for p in Path('app/build/intermediates').rglob('lint-results-*.txt'):
              for line in p.read_text(errors='ignore').splitlines():
                  if ': Error:' in line:
                      m=re.search(r'\[([^\]]+)\]\s*$', line)
                      counts[m.group(1) if m else 'UNCLASSIFIED'] += 1
          Path('/tmp/baseline_lint.json').write_text(json.dumps(counts, sort_keys=True))
          print('BASELINE_LINT_ERRORS', sum(counts.values()), dict(counts))
          PY

      - name: Apply source upgrades
        run: |
          set -euo pipefail
          python3 scripts/teach_ai_v2_patch.py
          python3 scripts/remove_blocked_window_api.py
          git diff --check

      - name: Unit tests and APK compile
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Ensure patch adds no lint errors
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug :app:lintRelease --continue
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import collections, json, re, sys
          baseline=collections.Counter(json.loads(Path('/tmp/baseline_lint.json').read_text()))
          patched=collections.Counter()
          for p in Path('app/build/intermediates').rglob('lint-results-*.txt'):
              for line in p.read_text(errors='ignore').splitlines():
                  if ': Error:' in line:
                      m=re.search(r'\[([^\]]+)\]\s*$', line)
                      patched[m.group(1) if m else 'UNCLASSIFIED'] += 1
          added={k: patched[k]-baseline[k] for k in patched if patched[k] > baseline[k]}
          print('BASELINE_LINT_ERRORS', sum(baseline.values()), dict(baseline))
          print('PATCHED_LINT_ERRORS', sum(patched.values()), dict(patched))
          if added:
              print('NEW_LINT_ERRORS', added)
              sys.exit(1)
          print('NO_NEW_LINT_ERRORS')
          PY

      - name: Commit verified source
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'Aaris-khan'
          git config user.email 'hhakmuddin8@gmail.com'
          git add app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt app/src/main/java/com/aarishkhan/aarishai/AiProviderSpec.kt app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt app/src/test/java/com/aarishkhan/aarishai/AiProviderSpecTest.kt
          git commit -m 'Teach Your AI: universal provider relay and full-screen preflight'
          git push origin HEAD:upgrade/teach-your-ai-v2
