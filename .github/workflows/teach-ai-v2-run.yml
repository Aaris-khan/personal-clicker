name: Teach Your AI v2 verify

on:
  push:
    branches:
      - upgrade/teach-your-ai-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply source patch
        run: |
          set -euo pipefail
          python3 scripts/teach_ai_v2_patch.py
          git diff --check
      - name: Test lint build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
      - name: Commit verified source
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'Aaris-khan'
          git config user.email 'hhakmuddin8@gmail.com'
          git add app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt app/src/main/java/com/aarishkhan/aarishai/AiProviderSpec.kt app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt app/src/test/java/com/aarishkhan/aarishai/AiProviderSpecTest.kt
          git commit -m 'Teach Your AI: universal provider relay and preflight'
          git push origin HEAD:upgrade/teach-your-ai-v2
