name: Autonomy Final Compile Gate

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/autonomy-final-compile-gate.yml'
      - 'app/**'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compile debug APK
        id: compile
        continue-on-error: true
        run: gradle --no-daemon :app:assembleDebug

      - name: Persist compile result
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p .ci-status
          {
            echo "source_sha=${SOURCE_SHA}"
            echo "compile_outcome=${COMPILE_OUTCOME}"
            echo "workflow=Autonomy Final Compile Gate"
          } > ".ci-status/autonomy-final-compile-${SOURCE_SHA}.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ".ci-status/autonomy-final-compile-${SOURCE_SHA}.txt"
          if ! git diff --cached --quiet; then
            git commit -m "Record final autonomy compile result [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enforce compile result
        if: always() && steps.compile.outcome != 'success'
        run: exit 1
