name: UI-only hardening v5 final security verify

on:
  push:
    branches:
      - upgrade/ui-only-hardening-v5

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Apply final security hardening
        run: |
          set -euo pipefail
          python3 scripts/ui_only_hardening_v5.py
          git diff --check
          grep -q 'AARISH_UI_ONLY_PROMPT_INJECTION_GUARD_V5' app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          grep -q 'AARISH_UI_ONLY_SESSION_RACE_GUARD_V5' app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          grep -q 'AI app ka apna login/network alag ho sakta hai' app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt

      - name: Unit tests and APK compile
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Lint regression gate against verified baseline
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:lintDebug :app:lintRelease --continue
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import collections, re, sys
          allowed = collections.Counter({'NewApi': 38, 'SuspiciousIndentation': 2, 'WrongConstant': 2})
          actual = collections.Counter()
          for p in Path('app/build/intermediates').rglob('lint-results-*.txt'):
              for line in p.read_text(errors='ignore').splitlines():
                  if ': Error:' in line:
                      m = re.search(r'\[([^\]]+)\]\s*$', line)
                      actual[m.group(1) if m else 'UNCLASSIFIED'] += 1
          regressions = {k: actual[k] - allowed[k] for k in actual if actual[k] > allowed[k]}
          print('VERIFIED_BASELINE', sum(allowed.values()), dict(allowed))
          print('CURRENT_LINT_ERRORS', sum(actual.values()), dict(actual))
          if regressions:
              print('LINT_REGRESSION', regressions)
              sys.exit(1)
          print('NO_LINT_REGRESSION')
          PY

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'Aaris-khan'
          git config user.email 'hhakmuddin8@gmail.com'
          git add \
            app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt \
            app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt
          git commit -m 'Harden UI relay prompt trust and session race [skip ci]'
          git push origin HEAD:upgrade/ui-only-hardening-v5
