name: AI Sidecar Hardening Temporary

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ai-sidecar-hardening-temp.yml'

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Apply AI sidecar patch
        run: python3 tools/ai_sidecar_harden_temp.py

      - name: Compile Kotlin
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit verified hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          git rm .github/workflows/ai-sidecar-hardening-temp.yml tools/ai_sidecar_harden_temp.py
          git commit -m "Harden autonomous AI failover and recovery [skip ci]"
          git push origin main
