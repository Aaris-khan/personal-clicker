name: Recorded AI evidence rescue hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-recorded-evidence-rescue-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply source patch
        run: python3 .github/scripts/apply_ai_rescue_patch.py

      - name: Check diff
        run: |
          git diff --check
          git diff --stat
          grep -n 'AARISH_AI_AGENT_BOTTOM_ROW_V2' app/src/main/java/com/aarishkhan/aarishai/FloatingControlService.kt
          grep -n 'AARISH_AI_RESCUE_EVIDENCE_GRID_V2' app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          grep -n 'AARISH_IDENTITY_NO_BLIND_GEOMETRY_V2' app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit verified source
        run: |
          rm -f .github/workflows/agent-button-provider-hotfix.yml
          rm -f .github/workflows/ai-recorded-evidence-rescue-hotfix.yml
          rm -f .github/scripts/apply_ai_rescue_patch.py
          git config user.name 'Aarish Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Make recorded misses invoke evidence-backed AI rescue [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
