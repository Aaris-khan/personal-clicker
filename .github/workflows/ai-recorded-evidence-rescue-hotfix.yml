        if (Build.VERSION.SDK_INT < 24) return false
        val direction = directionRaw.trim().uppercase(Locale.US)
        val w = service.resources.displayMetrics.widthPixels.toFloat().coerceAtLeast(2f)
        val h = service.resources.displayMetrics.heightPixels.toFloat().coerceAtLeast(2f)
        val cx = w * 0.50f
        val cy = h * 0.52f
        val path = Path()
        when {
            direction.contains("LEFT") -> { path.moveTo(w * 0.78f, cy); path.lineTo(w * 0.22f, cy) }
            direction.contains("RIGHT") -> { path.moveTo(w * 0.22f, cy); path.lineTo(w * 0.78f, cy) }
            direction.contains("UP") || direction.contains("BACK") -> { path.moveTo(cx, h * 0.72f); path.lineTo(cx, h * 0.28f) }
            else -> { path.moveTo(cx, h * 0.28f); path.lineTo(cx, h * 0.72f) }
        }
        return try {
            val gesture = GestureDescription.Builder()
                .addStroke(GestureDescription.StrokeDescription(path, 0L, 430L))
                .build()
            service.dispatchGesture(gesture, null, null)
        } catch (_: Throwable) { false }
    }

