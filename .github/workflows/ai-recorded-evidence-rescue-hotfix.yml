    // AARISH_AI_RESCUE_EVIDENCE_GRID_V2
    private fun buildRescueEvidenceAttachment(currentScreenshot: File?): File? {
        val items = mutableListOf<Pair<String, File>>()
        rescueEvidenceSteps.takeLast(3).forEachIndexed { index, g ->
            val path = g.recordingEvidencePath.orEmpty()
            if (path.isNotBlank()) {
                val file = File(path)
                if (file.exists() && file.isFile) {
                    val label = if (index == rescueEvidenceSteps.takeLast(3).lastIndex) "FAILED RECORDED STEP" else "RECORDED CONTEXT ${index + 1}"
                    items.add(label to file)
                }
            }
        }
        if (currentScreenshot != null && currentScreenshot.exists()) items.add("CURRENT SCREEN" to currentScreenshot)
        if (items.isEmpty()) return currentScreenshot
        if (items.size == 1 && items[0].second == currentScreenshot) return currentScreenshot

        val decoded = items.mapNotNull { item ->
            try {
                android.graphics.BitmapFactory.decodeFile(item.second.absolutePath)?.let { item.first to it }
            } catch (_: Throwable) { null }
        }.take(4)
        if (decoded.isEmpty()) return currentScreenshot

        return try {
            val cellW = 480
            val cellH = 900
            val labelH = 54
            val cols = 2
            val rows = ((decoded.size + cols - 1) / cols).coerceAtLeast(1)
            val out = Bitmap.createBitmap(cellW * cols, cellH * rows, Bitmap.Config.ARGB_8888)
            val canvas = Canvas(out)
            canvas.drawColor(Color.rgb(18, 18, 18))
            val labelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.WHITE
                textSize = 25f
                typeface = Typeface.DEFAULT_BOLD
            }
            val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.rgb(90, 90, 90)
                style = Paint.Style.STROKE
                strokeWidth = 2f
            }

            decoded.forEachIndexed { i, pair ->
                val col = i % cols
                val row = i / cols
                val left = col * cellW
                val top = row * cellH
                canvas.drawText(pair.first.take(28), left + 12f, top + 35f, labelPaint)
                val src = pair.second
                val availW = (cellW - 20).coerceAtLeast(1)
                val availH = (cellH - labelH - 20).coerceAtLeast(1)
                val scale = minOf(availW.toFloat() / src.width.coerceAtLeast(1), availH.toFloat() / src.height.coerceAtLeast(1))
                val w = (src.width * scale).toInt().coerceAtLeast(1)
                val h = (src.height * scale).toInt().coerceAtLeast(1)
                val dstLeft = left + (cellW - w) / 2
                val dstTop = top + labelH + (availH - h) / 2
                val dst = Rect(dstLeft, dstTop, dstLeft + w, dstTop + h)
                canvas.drawBitmap(src, null, dst, null)
                canvas.drawRect(left.toFloat(), top.toFloat(), (left + cellW - 1).toFloat(), (top + cellH - 1).toFloat(), borderPaint)
            }

            val dir = File(service.cacheDir, "ai_sidecar").apply { mkdirs() }
            val file = File(dir, "rescue_${UUID.randomUUID()}.png")
            FileOutputStream(file).use { out.compress(Bitmap.CompressFormat.PNG, 92, it) }
            decoded.forEach { try { it.second.recycle() } catch (_: Throwable) {} }
            try { out.recycle() } catch (_: Throwable) {}
            file
        } catch (_: Throwable) {
            decoded.forEach { try { it.second.recycle() } catch (_: Throwable) {} }
            currentScreenshot
        }
    }

