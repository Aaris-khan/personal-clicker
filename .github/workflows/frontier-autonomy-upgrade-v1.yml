name: Frontier Autonomy Upgrade V1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/frontier-autonomy-upgrade-v1.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Apply repository-wide autonomy hardening
        run: python3 tools/frontier_autonomy_upgrade_v1.py

      - name: Static diff verification
        run: |
          git diff --check
          grep -q "AARISH_AUTONOMY_PROGRESS_WATCHDOG_V1" app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          grep -q "AARISH_LIVE_MATCH_PACKAGE_GUARD_V1" app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          grep -q "AARISH_30M_WAIT_CONTINUE_V1" app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          grep -q "AARISH_SAME_APP_XY_LAST_RESORT_V1" app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt

      - name: Compile, test task, and assemble APK
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare verified APK artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AarishAI-frontier-upgrade.apk
          sha256sum AarishAI-frontier-upgrade.apk > AarishAI-frontier-upgrade.apk.sha256
          ls -lh AarishAI-frontier-upgrade.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: AarishAI-frontier-upgrade-apk
          path: |
            AarishAI-frontier-upgrade.apk
            AarishAI-frontier-upgrade.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit only verified source and remove temporary upgrader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          git add app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          git rm .github/workflows/frontier-autonomy-upgrade-v1.yml
          git rm tools/frontier_autonomy_upgrade_v1.py
          git commit -m "Harden autonomous progress and replay recovery (verified run $GITHUB_RUN_ID)"
          git push origin HEAD:main
