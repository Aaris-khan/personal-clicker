name: Precision Dispatch Order

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/precision-dispatch-order.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Apply semantic-first dispatch patch
        run: |
          python3 .github/dispatch_order_patch.py
          git diff --check

      - name: Compile Kotlin without APK
        run: gradle --no-daemon :app:compileDebugKotlin

      - name: Commit verified dispatch order
        run: |
          git config user.name "Aaris Precision Upgrader"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          if git diff --cached --quiet; then
            echo "No source change required."
            exit 0
          fi
          git commit -m "Prioritize live semantic targets over visual fallbacks [skip ci]"
          git push origin HEAD:main
