name: Frontier Autonomy Policy Tests V1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/frontier-autonomy-policy-tests-v1.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Apply tested autonomy policy extraction
        run: python3 tools/frontier_autonomy_policy_tests_v1.py

      - name: Static diff verification
        run: |
          git diff --check
          grep -q "AutonomyPolicy.allowsPackageOnlyDone" app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          grep -q "AutonomyPolicy.isUnambiguousLaunchMatch" app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          grep -q "AutonomyPolicy.allowsRecordedTapCoordinateFallback" app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          test -f app/src/test/java/com/aarishkhan/aarishai/AutonomyPolicyTest.kt

      - name: Run executable policy tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile and assemble final APK
        run: gradle --no-daemon :app:compileDebugKotlin :app:assembleDebug

      - name: Prepare final verified APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AarishAI-frontier-final.apk
          sha256sum AarishAI-frontier-final.apk > AarishAI-frontier-final.apk.sha256
          ls -lh AarishAI-frontier-final.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: AarishAI-frontier-final-apk
          path: |
            AarishAI-frontier-final.apk
            AarishAI-frontier-final.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified production source and tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git add app/src/main/java/com/aarishkhan/aarishai/AiSidecarController.kt
          git add app/src/main/java/com/aarishkhan/aarishai/AutoActionService.kt
          git add app/src/main/java/com/aarishkhan/aarishai/AutonomyPolicy.kt
          git add app/src/test/java/com/aarishkhan/aarishai/AutonomyPolicyTest.kt
          git rm .github/workflows/frontier-autonomy-policy-tests-v1.yml
          git rm tools/frontier_autonomy_policy_tests_v1.py
          git commit -m "Add tested autonomy safety policies (verified run $GITHUB_RUN_ID)"
          git push origin HEAD:main
